urdf: arm6

ee_frame: link6

control_rate_hz: 200.0

task:
  characteristic_length: 0.2

  # `link7` 工具段移除后，将五个工作站沿各自工具轴回退 91 mm，
  # 使实际末端 `link6` 保持在原工作空间的可达范围内。
  reference_offset_local_m: [-0.084, 0.0, 0.035]

  orientation_mode: pen_axis

  pen_axis_local: [1.0, 0.0, 0.0]

  limit_avoidance:
    gain: 0.10
    activate_rad: 0.5

position:
  lambda: [72.0, 72.0, 72.0]
  k: [102.0, 102.0, 102.0]
  eta: [1.08, 1.08, 1.08]
  phi: [0.003, 0.003, 0.003]

orientation:
