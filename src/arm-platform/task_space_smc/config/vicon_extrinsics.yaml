# Vicon rigid body -> robot frame extrinsics.
#
# SOURCE: zzq handoff copy (vicon_extrinsics_zzq.yaml), swapped in 2026-08-25.
# The previous file (2026-08-05, 1.77 mm RMS) is preserved in git history. It became
# stale when the base and end-effector marker clusters were physically moved.
#
# ⚠️ THIS IS A TRIAL FIT, NOT A VALIDATED ONE. Read before trusting any result:
#   1. zzq's own metadata says status: diagnostic_only_for_position_and_orientation_quality,
#      and his notes decline to claim sub-10-mm accuracy across conditions.
#   2. Position residual is 8.61 mm RMS / 13.24 mm max — roughly 5x worse than the
#      2026-08-05 fit achieved on the old marker placement.
#   3. There is no leave-one-out figure, so overfitting is unmeasured.
#   4. arm_ee_from_link6.translation_m is IDENTICAL to the old file. zzq re-fitted only
#      the BASE transform. If the end-effector markers also moved, that lever arm is
#      still stale and ee_residual_rms_m will not fully recover.
#   5. test/core/test_base_state_fusion.py::test_extrinsics_yaml_still_carries_both_vectors_unswapped
#      hardcodes the old base translation and will FAIL against this file.
#
# The correct fix remains re-running task_space_smc/hw/vicon_base_extrinsic_calibrate.py
# on the current hardware. See docs/README_jasyach.md section 6.
#
# Coordinate convention: Vicon Y-up. Quaternion order: x,y,z,w.

metadata:
  date: "2026-08-24"
  samples: 16
  urdf: "arm6.urdf"
  ee_frame: "link6"
  vicon_up_axis: "+y"
  status: "diagnostic_only_for_position_and_orientation_quality"
  position_residual_rms_mm: 8.6125845
  position_residual_max_mm: 13.2422972

# Transform semantics:
# p_arm_base = R_arm_base_from_base_link * p_base_link + t_arm_base_from_base_link
# The bridge composes V_T_B = V_T_Rb . Rb_T_B, i.e.
#   p_wb = p_vr + R_vr @ t_rb ; q_wb = q_vr * q_rb
# matching _transform_pose in vicon_floating_base_bridge.py (around lines 367-387).
arm_base_from_base_link:
  translation_m: [0.0356877332, -0.0416385701, -0.0178878451]   # |t| = 57.68 mm (old file: 33.07 mm)
  quaternion_xyzw: [-0.6747091816, -0.1120866705, 0.0005753346, 0.7295229726]

# Fixed marker-origin transform used for EE position validation.
# Control orientation remains FK/link6; arm_ee orientation is validation-only.
# ⚠️ Unchanged from the 2026-08-05 file — not re-fitted by zzq.
arm_ee_from_link6:
  translation_m: [0.0119, 0.0047, 0.0125]                        # |t| = 17.8 mm
  quaternion_xyzw: [0.8852728911, 0.0654227164, 0.0463393357, 0.4581096402]

notes:
  - "Do not swap quaternion order to w,x,y,z."
  - "The base transform is loaded by vicon_floating_base.launch.py."
  - "The EE transform is retained for geometry validation and handoff; control orientation remains FK/link6."
  - "This diagnostic result was not used to claim sub-10-mm geometry accuracy across all conditions."
