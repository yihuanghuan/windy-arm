# A-L1-GAMMA 6 关节实机标定值
#
# 来源：阶段 2（力矩通路）+ 阶段 3（迭代重力标定），2026-08-02。
# 原始数据：task_space_smc/data/phase3/phase3_calibration_20260802_105043.json
# 方法与依据：task_space_smc/PHASE1_FINDINGS.md
#
# 使用方式：
#   历史语义：q_model = q_encoder + zero_offset_rad；不是写电机零位。
#   first_moment_ratio 是相对原CAD模型的历史拟合记录，已烘入 arm6/arm6_tool 惯性；运行时不可再乘。
#   当前URDF前馈 = g_urdf(q_encoder + 显式验证的model_offset)，默认offset=0。
#   本文件历史offset/惯量/摩擦/alpha不构成跨硬件有效的标定。
#
# ⚠️ 标定值与机械状态绑定。以下任一情况发生后必须重测：
#   - 拆装关节、更换电机、调整预紧
#   - 基座【倾角】改变（纯平移不影响，重力是均匀场）
#   - 手工掰动关节

metadata:
  date: "2026-08-02"
  urdf: "arm6.urdf"
  method: "gravity sweep with torque feedforward (MIT mode)"
  torque_scale_alpha: 1.033        # 0x12 命令标度，阶段 2 六关节合并 ±0.024
  temperature_c: [28, 29, 27, 31, 32, 31]   # 标定时各关节温度

# 零位偏差：URDF 建模零位与编码器零位之差
zero_offset_rad: [0.039576, -0.297745, -0.020218, -0.192988, -0.111667, 0.0]

zero_offset_deg: [2.268, -17.060, -1.158, -11.057, -6.398, 0.0]

# 收敛状态。未收敛的关节其值仍是当前最佳估计，但不确定度更大。
zero_offset_converged: [true, true, true, false, false, false]

# 各关节零位偏差的不确定度（度）。收敛的取末两遍之差，未收敛的取遍间散布。
# joint1/2/3 取收敛时末两遍之差；joint4/5 未收敛，取多遍【标准差】而非标准误
# —— 标准误假设各遍独立，但 joint5 第二轮三遍单调下降(-0.835, -0.933)，
# 存在系统性漂移，独立性不成立，用标准误会低估。
zero_offset_uncertainty_deg: [0.141, 0.316, 0.163, 2.0, 1.161, null]

# 一阶质量矩比值 = A_实测 / A_【CAD名义】模型。URDF 偏轻则 >1。
#
# ⚠️⚠️ 【此比值已烘进 arm6.urdf 与 arm6_tool.urdf 的连杆惯性参数】。
# 那两个 URDF 算出的重力是历史拟合后的模型估计，不保证新硬件准确；不可重复乘系数。
# 保留此字段是为了记录来源与供复测对照：若按修正后的 URDF 重跑阶段 3，
# 应当测得比值 ≈ 1.0（j1/j2/j3 偏差 2.3~3.6%）。
# config/arm.urdf (7 关节) 未修正；不得自动将这组六轴拟合值移植过去。
first_moment_ratio: [1.265, 1.349, 1.228, 0.972, 1.021, 1.0]

# 静摩擦（启动力矩），阶段 2 双向测量的半和。
# ⚠️ 这是【静摩擦】。动摩擦小 3~10 倍（Stribeck），不要混用。
stiction_nm: [0.725, 1.775, 0.625, 0.125, 0.100, 0.100]

# 摩擦死区 = stiction / kp，即位置不确定度的物理下限
deadband_rad: [0.0242, 0.0592, 0.0208, 0.0250, 0.0200, 0.0200]

# ---------------------------------------------------------------------------
# 逐关节说明
# ---------------------------------------------------------------------------
notes:
  joint1: "收敛，漂移 0.141°。扫描区间 [-0.88, 1.40]（原区间起点会让 joint6 撞围栏）"
  joint2: "收敛，漂移 0.316°。静摩擦 1.775 Nm 是其余关节的 2.4~18 倍，
           但已用低载荷实验排除关节缺陷 —— 它是承载最重的关节"
  joint3: "收敛，漂移 0.163°。ratio 1.228 与阶段 1 位置模式的 1.220 吻合 0.7%"
  joint4: "未收敛。A/f≈1（重力 0.13 Nm ≈ 静摩擦 0.125），相位噪声大。
           三遍单调漂移 -13.5 -> -13.0 -> -11.1，不确定度约 ±2°。
           末端灵敏度仅 0.897 mm/°，占误差预算 0.5%，可接受"
  joint5: "未收敛（A/f≈1 的物理边界）。已用两轮共 6 遍正式扫描统计定值。

           第一轮 ±1.85：-4.340 / -6.994 / -6.579（端点过冲超限位，单向进入
           协议失效 4 次；端点恰是相位拟合权重最大处）
           第二轮 ±1.70：-5.958 / -6.793 / -7.726（协议违规 0 次）

           修复效果：resid/A 0.347 -> 0.198，sag_max 0.0167 -> 0.0112，
           ratio 0.905 -> 1.021（13% 变化，说明旧值受协议失效污染）。

           取值 -6.398°（6 遍均值），不确定度 ±1.161°（标准差，非标准误 ——
           第二轮单调漂移使各遍不独立）。末端贡献 1.70 mm"
  joint6: "无重力信号 —— link6 质心在 joint6 转轴上（径向偏移 0.113 mm），
           转它既不移动质心也不移动末端。末端位置灵敏度 0.0000 mm/rad，
           零位偏差按 0 处理。装上末端工具后才可标定"

# ---------------------------------------------------------------------------
# 已知的方法学陷阱（复测时务必注意）
# ---------------------------------------------------------------------------
caveats:
  - "resid/A < 0.05 只在 A/f > 5 时才指示几何错误。joint4/5 的 resid/A
     达 0.29~0.35 是摩擦主导，不是几何问题"
  - "相位精度由【拟合条件数】决定，不是 死区/√N。扫描区间覆盖的周期比例
     太小会使幅值与相位强耦合 —— joint4 用 0.8 rad 区间时 ratio 错了 59%"
  - "温度不是漂移主因。486 秒对照记录显示 joint4/5 温度零变化而 offset
     变了 9.9°"

# ---------------------------------------------------------------------------
# 阶段 5：惯量辨识（kp=0 重力补偿基础上叠加力矩脉冲，斜率法）
# ---------------------------------------------------------------------------
# 方法：qdd = (tau_extra - f_kinetic) / M，斜率 d(qdd)/d(tau) = 1/M。
# 摩擦只影响截距不影响斜率 —— 与阶段 2 测 0x12 标度同一手法。
# 验证：qdd 对 tau 的线性度 R² = 0.981~0.9997。
#
# ⚠️ 这是【有效惯量】，含转子经减速比反射的部分 (J_rotor x N²)，
#    URDF 只有连杆惯量。实测/URDF = 2.5~20.5 倍，小关节倍数更大
#    （joint4 的 98% 来自转子）。控制器需要的正是这个有效值。
inertia_kgm2:         [0.11198, 0.19707, 0.12985, 0.01231, 0.01154, null]
inertia_stderr_kgm2:  [0.00106, 0.01567, 0.00324, 0.00035, 0.00074, null]
inertia_urdf_kgm2:    [0.0129,  0.0788,  0.0138,  0.0006,  0.0008,  null]

# 动摩擦（拟合截距反推）。注意与上面的 stiction_nm（静摩擦）不是一回事 ——
# 两者差 0.8~32 倍（Stribeck）。加速时用动摩擦，起步时用静摩擦。
kinetic_friction_nm:  [-0.023,  1.675,   0.770,   0.032,   0.018,   null]

# joint6 无法辨识：其惯量仅为转子惯量，任何可测的脉冲时长下加速度都过大
# （估算 12595 rad/s²，200 Hz 遥测下拿不到一个完整采样）。这与它没有重力
# 信号是同一根源 —— link6 质心在 joint6 转轴上。

# 转子惯量经减速比反射的等效值 (J_rotor x N²)，加在质量矩阵对角上：
#   M_有效 = M_连杆(URDF) + diag(armature)
# 这样连杆惯量保持物理真实，转子项单独表达 —— 对应 pinocchio 的 model.armature。
# 由 armature = M_实测 − M_连杆(辨识位姿处) 得到，回代校验误差 0.00%。
# ⚠️ 已按【修正后的】arm6/arm6_tool URDF 重算（连杆变重 -> armature 变小，
#    否则总惯量被重复计入）。相对名义 URDF 的旧值
#    [0.10163,0.11814,0.11595,0.01170,0.01072,0.01072] 变化 -1.4%~-20.4%。
#    改动 URDF 惯性参数后必须再次重算此项。
# 占总惯量的 60~95%，数值符合电机型号（DM4340 约 0.10~0.12，RS05 约 0.011）。
# joint6 未辨识（惯量仅转子、加速度过大测不了），按同型号 joint5 取值。
armature_kgm2: [0.09527, 0.09405, 0.11219, 0.01154, 0.01050, 0.01050]
