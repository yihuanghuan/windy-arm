notes:
  joint1: 收敛，漂移 0.141°。扫描区间 [-0.88, 1.40]（原区间起点会让 joint6 撞围栏）
  joint2: 收敛，漂移 0.316°。静摩擦 1.775 Nm 是其余关节的 2.4~18 倍， 但已用低载荷实验排除关节缺陷 —— 它是承载最重的关节
  joint3: 收敛，漂移 0.163°。ratio 1.228 与阶段 1 位置模式的 1.220 吻合 0.7%
  joint4: 未收敛。A/f≈1（重力 0.13 Nm ≈ 静摩擦 0.125），相位噪声大。 三遍单调漂移 -13.5 -> -13.0 -> -11.1，不确定度约
    ±2°。 末端灵敏度仅 0.897 mm/°，占误差预算 0.5%，可接受
  joint5: '未收敛（A/f≈1 的物理边界）。已用两轮共 6 遍正式扫描统计定值。

    第一轮 ±1.85：-4.340 / -6.994 / -6.579（端点过冲超限位，单向进入 协议失效 4 次；端点恰是相位拟合权重最大处） 第二轮 ±1.70：-5.958
    / -6.793 / -7.726（协议违规 0 次）

    修复效果：resid/A 0.347 -> 0.198，sag_max 0.0167 -> 0.0112， ratio 0.905 -> 1.021（13%
    变化，说明旧值受协议失效污染）。

    取值 -6.398°（6 遍均值），不确定度 ±1.161°（标准差，非标准误 —— 第二轮单调漂移使各遍不独立）。末端贡献 1.70 mm'
  joint6: 无重力信号 —— link6 质心在 joint6 转轴上（径向偏移 0.113 mm）， 转它既不移动质心也不移动末端。末端位置灵敏度 0.0000
    mm/rad， 零位偏差按 0 处理。装上末端工具后才可标定
caveats:
- resid/A < 0.05 只在 A/f > 5 时才指示几何错误。joint4/5 的 resid/A 达 0.29~0.35 是摩擦主导，不是几何问题
- 相位精度由【拟合条件数】决定，不是 死区/√N。扫描区间覆盖的周期比例 太小会使幅值与相位强耦合 —— joint4 用 0.8 rad 区间时 ratio 错了
  59%
- 温度不是漂移主因。486 秒对照记录显示 joint4/5 温度零变化而 offset 变了 9.9°
